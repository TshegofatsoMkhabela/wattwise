name: Azure Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-wattwise-demo' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'wattwise-demo-api' }}
  CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  test:
    name: Test frontend and backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:demo

      - name: Test frontend rules
        run: npm run test:unit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: codebase/backend
        run: pip install -r requirements.txt

      - name: Test backend demo API
        working-directory: codebase/backend
        run: pytest

      - name: Build frontend
        run: npm run build:static

      - name: Prepare Static Web Apps config
        run: cp staticwebapp.config.json dist/client/staticwebapp.config.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test frontend
        run: npm run test:e2e

  deploy-backend:
    name: Deploy backend container
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_CONTAINER_REGISTRY != '' }}
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$CONTAINER_REGISTRY"

      - name: Build and push backend image
        run: |
          IMAGE="${CONTAINER_REGISTRY}.azurecr.io/wattwise-api:${GITHUB_SHA}"
          docker build -t "$IMAGE" codebase/backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars APP_ENV=production DIRECTLINE_SECRET=secretref:directline-secret

      - name: Read backend URL
        id: api
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend static app
    needs: [test, deploy-backend]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test.result == 'success' && needs.deploy-backend.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for Azure
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.api_url || vars.VITE_API_BASE_URL }}
          VITE_DIRECTLINE_TOKEN_URL: ${{ format('{0}/api/directline/token', needs.deploy-backend.outputs.api_url || vars.VITE_API_BASE_URL) }}
        run: npm run build:static

      - name: Prepare Static Web Apps config
        run: cp staticwebapp.config.json dist/client/staticwebapp.config.json

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/client
          skip_app_build: true
